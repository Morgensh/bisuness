<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Колония: Кеплер-7</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #0a0710;
  --pn: rgba(24, 18, 22, 0.96);
  --tx: #eadfd6;
  --bd: #4a3a38;
  --ac: #fb923c;
  --bt: #2a2024;
  --mu: #a8958a;
}
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overscroll-behavior: none;
}
#app {
  position: fixed;
  inset: 0;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}
#top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: calc(6px + env(safe-area-inset-top, 0px)) 56px 6px 10px;
  background: var(--pn);
  border-bottom: 1px solid var(--bd);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
  backdrop-filter: blur(4px);
}
#plus {
  position: absolute;
  right: 8px;
  top: calc(6px + env(safe-area-inset-top, 0px));
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--bd);
  background: var(--bt);
  color: var(--tx);
  font-size: 24px;
  line-height: 1;
  padding: 0;
}
#top small {
  display: block;
  font-weight: 400;
  color: var(--mu);
  font-size: 11px;
}
#bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--pn);
  border-top: 1px solid var(--bd);
  touch-action: pan-x;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#bar::-webkit-scrollbar { display: none; }
#bar button {
  flex: none;
  min-height: 52px;
  min-width: 72px;
  padding: 6px 10px;
  border: 1px solid var(--bd);
  border-radius: 8px;
  background: var(--bt);
  color: var(--tx);
  font: 700 12px system-ui;
  white-space: nowrap;
}
#bar button small {
  display: block;
  font-weight: 400;
  font-size: 10px;
  color: var(--mu);
}
#bar button.on {
  background: var(--ac);
  color: #1a0f08;
  border-color: var(--ac);
}
#bar button.on small { color: #1a0f08; font-weight: 600; }
#loc {
  position: absolute;
  right: 10px;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--bd);
  background: var(--pn);
  color: var(--tx);
  font-size: 20px;
}
#msg {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  max-width: 86%;
  padding: 8px 14px;
  border-radius: 12px;
  background: var(--pn);
  border: 1px solid var(--bd);
  font-size: 13px;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity .25s;
}
#ban {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  gap: 14px;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  background: rgba(10, 7, 16, 0.9);
  color: #fdba74;
}
#bt { font-size: 20px; font-weight: 800; max-width: 320px; line-height: 1.4; }
#ban-sub { font-size: 13px; color: #eadfd6; max-width: 280px; }
.ban-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 260px; }
.btn-primary {
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #fb923c;
  color: #1a0f08;
  font: 700 15px system-ui;
  cursor: pointer;
}
.btn-secondary {
  padding: 12px;
  border: 1px solid var(--bd);
  border-radius: 10px;
  background: transparent;
  color: #eadfd6;
  font: 600 14px system-ui;
  cursor: pointer;
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="top">
    <button id="plus" aria-label="Новая игра">＋</button>
    <div id="h1"></div>
    <div id="h2"></div>
    <small id="h3"></small>
  </div>
  <button id="loc">📍</button>
  <div id="msg"></div>
  <div id="bar"></div>
  <div id="ban">
    <div id="bt"></div>
    <div id="ban-sub"></div>
    <div class="ban-actions">
      <button id="btn-rescue" class="btn-primary" style="display:none">Позвать друга (Спасти) 🤝</button>
      <button id="btn-restart" class="btn-secondary">Новая колония</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="buildings.js"></script>
<script src="network.js"></script>
<script src="units.js"></script>
<script src="game.js"></script>
<script src="render.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
</body>
</html>
